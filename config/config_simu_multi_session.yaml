# pre process
ds_size: 0.1
maximum_corner_num: 100

# key points
plane_detection_thre: 0.01
plane_merge_normal_thre: 0.1
plane_merge_dis_thre: 0.3
voxel_size: 2
voxel_init_num: 10
proj_image_resolution: 0.5
proj_dis_min: 0
proj_dis_max: 5
corner_thre: 10


# std descriptor
descriptor_near_num: 20
descriptor_min_len: 2
descriptor_max_len: 30
non_max_suppression_radius: 2
std_side_resolution: 0.2

# candidate search
skip_near_num: 50
candidate_num: 50
sub_frame_num: 10
vertex_diff_threshold: 0.5
rough_dis_threshold: 0.01
normal_threshold: 0.2
dis_threshold: 0.5
icp_threshold: 0.7

keyframe:
  keyframe_save: true
  pcd_dir: "/root/catkin_ws/src/STD/data_simu/red/pcd/"
  std_dir: "/root/catkin_ws/src/STD/data_simu/red/std/"
  pos_dir: "/root/catkin_ws/src/STD/data_simu/red/"

inter_session_icp_threshold: 0.4

multi_session:
  mode: 1  # enabled for multi-session
  cur_dir: "/root/catkin_ws/src/STD/data_simu/red/"
  ref_dir: "/root/catkin_ws/src/STD/data_simu/blue/"

  # GT with perturbation: +1m on x, +1m on y (translation only)
  # Original GT: yaw=182.8deg, x=80.7, y=-0.42
  # Perturbed:   yaw=182.8deg (unchanged), x=81.7 (+1m), y=0.58 (+1m)
  initial_T_W1_W0: [
    -0.998806,  0.048850,  0.000000,  81.700000,
    -0.048850, -0.998806,  0.000000,   0.580000,
     0.000000,  0.000000,  1.000000,   0.000000,
     0.000000,  0.000000,  0.000000,   1.000000
  ]

  inter_session_max_dist: 30
  inter_consis_max_trans: 10
  inter_consis_max_rot: 0.6
