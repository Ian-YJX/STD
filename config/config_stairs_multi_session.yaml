# STD config for GEODE stairs multi-session (gamma = Session 1, alpha = Session 0)
# pre process
ds_size: 0.1
maximum_corner_num: 100

# key points
plane_detection_thre: 0.01
plane_merge_normal_thre: 0.1
plane_merge_dis_thre: 0.3
voxel_size: 1
voxel_init_num: 10
proj_image_resolution: 0.5
proj_dis_min: 0
proj_dis_max: 5
corner_thre: 10

# std descriptor
descriptor_near_num: 20
descriptor_min_len: 1
descriptor_max_len: 20
non_max_suppression_radius: 2
std_side_resolution: 0.2

# candidate search
skip_near_num: 50
candidate_num: 50
sub_frame_num: 10
vertex_diff_threshold: 0.5
rough_dis_threshold: 0.01
normal_threshold: 0.2
dis_threshold: 0.5
icp_threshold: 0.7

keyframe:
  keyframe_save: true
  pcd_dir: "/root/catkin_ws/src/STD/data_stairs/gamma/pcd/"
  std_dir: "/root/catkin_ws/src/STD/data_stairs/gamma/std/"
  pos_dir: "/root/catkin_ws/src/STD/data_stairs/gamma/"

inter_session_icp_threshold: 0.4

multi_session:
  mode: 1  # enabled for multi-session
  cur_dir: "/root/catkin_ws/src/STD/data_stairs/gamma/"
  ref_dir: "/root/catkin_ws/src/STD/data_stairs/alpha/"

  # Identity initial guess (same stairwell, unknown relative start)
  # Adjust if STD fails to find matches automatically
  initial_T_W1_W0: [
    -0.43515771, -0.89811857, -0.06340142, 37.367, 
    0.89648938, -0.4256972, -0.12283176, -14.6329, 
    0.08332768, -0.11028997, 0.99040023, -20.4979, 
    0, 0, 0, 1
  ]

  inter_session_max_dist: 50
  inter_consis_max_trans: 15
  inter_consis_max_rot: 0.8
